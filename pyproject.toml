[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "codopex"
dynamic = ["version"]
description = "Generate symmetry-inequivalent co-doping defect-pair and higher-order complexes in a host supercell"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kanrw", email = "solitaedu@163.com" }]
keywords = ["defects", "doping", "codoping", "materials", "pymatgen"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.23",
    "pymatgen>=2024.1",
    "scipy>=1.9",
]

[project.optional-dependencies]
dev = [
    "pandas>=2.0",
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.6",
    "mypy>=1.10",
]

[project.scripts]
codopex = "codopex.cli:main"

[project.urls]
Homepage = "https://github.com/Kanrw/codopex"
Repository = "https://github.com/Kanrw/codopex"
Issues = "https://github.com/Kanrw/codopex/issues"
Changelog = "https://github.com/Kanrw/codopex/blob/main/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "codopex._version.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
codopex = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["codopex"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["codopex", "helpers"]

[tool.mypy]
# No fixed python_version: mypy then targets the interpreter running it.  A
# pinned 3.10 target cannot parse the PEP 695 syntax used by current numpy
# stubs (numpy/__init__.pyi) and aborts before checking any source file.
files = ["src/codopex"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
